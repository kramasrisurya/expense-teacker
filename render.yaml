# Render Blueprint - deploy the backend as a web service
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/expenses
    envVars:
      - key: JWT_SECRET
        generateValue: true
