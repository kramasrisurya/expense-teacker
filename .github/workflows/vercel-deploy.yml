# File: .github/workflows/vercel-deploy.yml
# Purpose: Deploy the frontend to Vercel (production) on every push to main.
#
# Required repository secrets:
#   VERCEL_TOKEN      - Vercel access token (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID     - run `vercel link` locally to find it in .vercel/project.json
#   VERCEL_PROJECT_ID - run `vercel link` locally to find it in .vercel/project.json

name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Run from the repo root: the Vercel project's Root Directory setting
          # is already "frontend", so cd-ing into it here doubles the path.
          working-directory: ./
          vercel-args: '--prod'
