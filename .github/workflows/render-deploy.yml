# File: .github/workflows/render-deploy.yml
# Purpose: Trigger a deployment of the backend on Render on every push to main.
#
# Required repository secret:
#   RENDER_DEPLOY_HOOK_URL - deploy hook URL from Render:
#     Dashboard -> expense-tracker-api -> Settings -> Deploy Hooks -> "Create Hook".

name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/render-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
